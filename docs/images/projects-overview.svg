<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc">The 3 Standalone Projects</text>
  <text x="400" y="65" text-anchor="middle" font-size="13" fill="#94a3b8">C11 systems projects, each in its own public repo</text>

  <!-- Project 1: bst-library -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="220" height="240" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="220" height="50" rx="12" fill="url(#box)"/>
    <rect y="38" width="220" height="12" fill="url(#box)"/>
    <text x="110" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">bst-library</text>
    <text x="110" y="80" text-anchor="middle" font-size="11" fill="#94a3b8">Week 4 · C11</text>
    <text x="20" y="115" font-size="12" font-weight="600" fill="#e2e8f0">Generic binary</text>
    <text x="20" y="132" font-size="12" font-weight="600" fill="#e2e8f0">search tree</text>
    <text x="20" y="165" font-size="11" fill="#94a3b8">~500 LOC</text>
    <text x="20" y="182" font-size="11" fill="#94a3b8">74 tests</text>
    <text x="20" y="199" font-size="11" fill="#94a3b8">3.5M ins/s</text>
    <text x="110" y="225" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="600">→ github.com/404Piyush/</text>
  </g>

  <!-- Project 2: arena-allocator -->
  <g transform="translate(290, 100)" filter="url(#shadow)">
    <rect width="220" height="240" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect width="220" height="50" rx="12" fill="url(#purple)"/>
    <rect y="38" width="220" height="12" fill="url(#purple)"/>
    <text x="110" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">arena-allocator</text>
    <text x="110" y="80" text-anchor="middle" font-size="11" fill="#94a3b8">Week 8 · C11</text>
    <text x="20" y="115" font-size="12" font-weight="600" fill="#e2e8f0">Bump arena</text>
    <text x="20" y="132" font-size="12" font-weight="600" fill="#e2e8f0">memory allocator</text>
    <text x="20" y="165" font-size="11" fill="#94a3b8">~300 LOC</text>
    <text x="20" y="182" font-size="11" fill="#94a3b8">143 tests</text>
    <text x="20" y="199" font-size="11" fill="#94a3b8">5–7× faster</text>
    <text x="110" y="225" text-anchor="middle" font-size="10" fill="#a855f7" font-weight="600">→ github.com/404Piyush/</text>
  </g>

  <!-- Project 3: pipe-shell -->
  <g transform="translate(540, 100)" filter="url(#shadow)">
    <rect width="220" height="240" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <rect width="220" height="50" rx="12" fill="url(#green)"/>
    <rect y="38" width="220" height="12" fill="url(#green)"/>
    <text x="110" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">pipe-shell</text>
    <text x="110" y="80" text-anchor="middle" font-size="11" fill="#94a3b8">Week 11 · C11</text>
    <text x="20" y="115" font-size="12" font-weight="600" fill="#e2e8f0">POSIX-ish</text>
    <text x="20" y="132" font-size="12" font-weight="600" fill="#e2e8f0">command shell</text>
    <text x="20" y="165" font-size="11" fill="#94a3b8">~500 LOC</text>
    <text x="20" y="182" font-size="11" fill="#94a3b8">56 tests</text>
    <text x="20" y="199" font-size="11" fill="#94a3b8">pipelines, redir</text>
    <text x="110" y="225" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="600">→ github.com/404Piyush/</text>
  </g>

  <text x="400" y="375" text-anchor="middle" font-size="11" fill="#64748b">273 assertions · 0 failures · 100% MIT</text>
</svg>
